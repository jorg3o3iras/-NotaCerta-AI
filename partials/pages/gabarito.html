<div class="page" id="page-gabarito">
  <div class="page-header">
    <div><div class="page-title">✅ Cadastrar / Editar Gabarito</div><p class="page-sub">Preencha as alternativas e os códigos Habilidade BNCC (opcional)</p></div>
  </div>
  <div class="card no-print">
    <div class="form-row c3">
      <div class="form-group"><label class="form-label">Prova <span class="req">*</span></label><select class="form-control" id="gab-prova" onchange="buildGabGrid()"><option value="">Selecione...</option></select></div>
      <div class="form-group"><label class="form-label">Série <span class="req">*</span></label><select class="form-control" id="gab-serie" onchange="buildGabGrid()"><option value="1">1º Ano — A, B, C</option><option selected value="2">2º Ano — A, B, C, D</option><option value="3">3º Ano — A, B, C, D</option><option value="4">4º Ano — A, B, C, D</option><option value="5">5º Ano — A, B, C, D</option><option value="6">6º Ano — A, B, C, D</option><option value="7">7º Ano — A, B, C, D</option><option value="8">8º Ano — A, B, C, D</option><option value="9">9º Ano — A, B, C, D</option></select></div>
      <div class="form-group"><label class="form-label">Nº de Questões</label><select class="form-control" id="gab-total" onchange="buildGabGrid()"></select></div>
    </div>
    <div id="gab-info-alts" style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="padding:8px 14px;background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.3);border-radius:8px;font-size:12px;font-weight:700;color:#a78bfa;">📝 Gabarito com 4 alternativas: A, B, C, D</div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title">📝 Gabarito das Questões</div>
      <div class="btn-group no-print">
        <button type="button" class="btn btn-outline btn-sm" onclick="fillGabRand()">🎲 Teste</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="clearGab()">🗑 Limpar</button>
      </div>
    </div>
    <div id="gab-header-container"></div>
    <div class="gab-grid" id="gab-grid"></div>
    <div class="form-row c3 no-print" id="gab-pts-row" style="margin-top:18px">
      <div class="form-group"><label class="form-label">Pts por Acerto</label><input class="form-control" step="0.1" type="number" value="0.5" /></div>
      <div class="form-group"><label class="form-label">Penalidade</label><select class="form-control"><option>Sem penalidade</option><option>-0.25</option><option>-0.5</option></select></div>
      <div class="form-group"><label class="form-label">Questões Anuladas</label><input class="form-control" placeholder="Ex: 5, 12" /></div>
    </div>
    <div class="btn-group no-print">
      <button type="button" class="btn btn-green" onclick="saveGab()">💾 Salvar Gabarito</button>
      <button type="button" class="btn btn-purple" onclick="go('corrigir-ia')">🤖 Corrigir com IA</button>
      <button type="button" class="btn btn-orange" id="btn-correcao-manual-gab" onclick="abrirCorrecaoManualStandalone()" style="display:none">✏ Correção Manual</button>
    </div>
  </div>
</div>

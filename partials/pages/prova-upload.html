<div class="page" id="page-prova-upload">
  <div class="page-header">
    <div><div class="page-title">📤 Cadastrar Prova</div><p class="page-sub">Configure os parâmetros da avaliação</p></div>
  </div>
  <div class="g2 no-print">
    <div class="card">
      <div class="card-header"><div class="card-title">📝 Informações</div></div>
      <div class="form-row c1">
        <div class="form-group"><label class="form-label">Título <span class="req">*</span></label><input class="form-control" id="prova-titulo" placeholder="Ex: 1º Semestre — Matemática" /></div>
      </div>
      <div class="form-row c1">
        <div class="form-group"><label class="form-label">Escola <span class="req">*</span></label><select class="form-control" id="prova-escola"><option value="">Selecione a escola...</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Disciplina <span class="req">*</span></label>
          <select class="form-control" id="prova-disciplina" onchange="atualizarInfoAlts()">
            <option value="Matemática">Matemática</option>
            <option value="Português">Português</option>
            <option value="Produção de Texto">Produção de Texto</option>
            <option value="Ciências Humanas">Ciências Humanas</option>
            <option value="Ciências Naturais">Ciências Naturais</option>
            <option value="História">História</option>
            <option value="Geografia">Geografia</option>
            <option value="Inglês">Inglês</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Semestre</label>
          <select class="form-control" id="prova-bimestre">
            <option selected value="1º SEMESTRE">1º SEMESTRE</option>
            <option value="2º SEMESTRE">2º SEMESTRE</option>
            <option value="3º SEMESTRE">3º SEMESTRE</option>
            <option value="4º SEMESTRE">4º SEMESTRE</option>
            <option value="RECUPERAÇÃO">RECUPERAÇÃO</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Série <span class="req">*</span></label><select class="form-control" id="prova-serie" onchange="atualizarInfoAlts()"><option value="1º Ano">1º Ano</option><option value="2º Ano">2º Ano</option><option value="3º Ano">3º Ano</option><option value="4º Ano">4º Ano</option><option value="5º Ano">5º Ano</option><option value="6º Ano">6º Ano</option><option value="7º Ano">7º Ano</option><option value="8º Ano">8º Ano</option><option value="9º Ano">9º Ano</option></select></div>
        <div class="form-group"><label class="form-label">Data</label><input class="form-control" id="prova-data" type="date" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Nº de Questões</label><select class="form-control" id="prova-questoes"></select></div>
        <div class="form-group"><label class="form-label">Nota Máxima</label><input class="form-control" id="prova-nota" type="number" value="10" /></div>
      </div>
      <div id="info-alts" style="padding:10px 14px;background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.25);border-radius:8px;font-size:12px;color:#a78bfa;font-weight:600;margin-bottom:6px;">ℹ 1º Ano — Gabarito com 3 alternativas: A, B, C</div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">📁 Arquivo</div></div>
      <div class="upload-zone" onclick="simUpload()" style="margin-bottom:14px">
        <div class="uz-ico">📤</div>
        <p><strong>Clique para enviar</strong> ou arraste aqui</p>
        <p class="uz-hint">PDF, DOCX, PNG — máx. 50MB</p>
      </div>
      <div id="up-ok" style="display:none;padding:12px;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:8px;margin-bottom:14px;font-size:13px;color:var(--green);">✅ <strong>arquivo_enviado.pdf</strong> — enviado!</div>
      <div class="btn-group">
        <button type="button" class="btn btn-green btn-full" onclick="salvarProva()">💾 Salvar</button>
        <button type="button" class="btn btn-primary btn-full" onclick="go('gabarito')">➡ Gabarito</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay no-print" id="m-escola">
  <div class="modal">
    <div class="modal-header"><h3>🏫 Cadastrar Escola</h3><button type="button" class="modal-close" onclick="closeM('m-escola')">×</button></div>
    <div class="form-row c1"><div class="form-group"><label class="form-label">Nome <span class="req">*</span></label><input class="form-control" id="escola-nome" /></div></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">INEP</label><input class="form-control" id="escola-inep" /></div>
      <div class="form-group"><label class="form-label">Município</label><input class="form-control" id="escola-municipio" /></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">UF</label><input class="form-control" id="escola-estado" maxlength="2" /></div>
      <div class="form-group"><label class="form-label">Telefone</label><input class="form-control" id="escola-telefone" /></div>
    </div>
    <div class="form-row c1"><div class="form-group"><label class="form-label">Diretor(a)</label><input class="form-control" id="escola-diretor" /></div></div>
    <div class="modal-footer no-print">
      <button type="button" class="btn btn-outline" onclick="closeM('m-escola')">Cancelar</button>
      <button type="button" class="btn btn-green" onclick="salvarEscola()">💾 Salvar</button>
    </div>
  </div>
</div>

<div class="del-modal no-print" id="del-modal">
  <div class="del-box">
    <div class="del-icon">🗑</div>
    <h3>Confirmar Exclusão</h3>
    <p>Tem certeza que deseja excluir<br /><span class="del-nome-txt" id="del-nome-txt">este item</span>?<br /><br />Esta ação não pode ser desfeita.</p>
    <div class="del-actions">
      <button type="button" class="btn btn-outline" onclick="cancelarDel()">Cancelar</button>
      <button type="button" class="btn btn-red" onclick="confirmarDel()">🗑 Excluir</button>
    </div>
  </div>
</div>

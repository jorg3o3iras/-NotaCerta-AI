<div class="modal-overlay no-print" id="m-aluno">
  <div class="modal">
    <div class="modal-header">
      <h3>🎒 Cadastrar Aluno</h3>
      <div style="display: flex; align-items: center; gap: 8px">
        <button type="button" class="btn btn-green btn-sm" onclick="fecharAbaMulti()">📋 Lista</button>
        <button type="button" class="modal-close" onclick="closeM('m-aluno')">×</button>
      </div>
    </div>
    <div class="form-row" style="grid-template-columns: 130px 1fr">
      <div class="form-group"><label class="form-label">Número</label><input class="form-control" id="aluno-numero" type="number" /></div>
      <div class="form-group"><label class="form-label">Nome <span class="req">*</span></label><input class="form-control" id="aluno-nome" /></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Escola <span class="req">*</span></label><select class="form-control" id="aluno-escola" onchange="carregarTurmasPorEscolaParaAluno(this.value, 'aluno-turma')"></select></div>
      <div class="form-group"><label class="form-label">Turma <span class="req">*</span></label><select class="form-control" id="aluno-turma"></select></div>
    </div>
    <div class="multi-import-area no-print">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 6px;">
        <span style="font-size: 12px; font-weight: 700; color: var(--text2)">📋 Cadastro Múltiplo</span>
        <button type="button" class="btn btn-primary btn-sm" onclick="processarListaAlunos()">➕ Adicionar Múltiplos</button>
      </div>
      <textarea id="multi-alunos-input" placeholder="Cole a lista de alunos aqui." rows="3"></textarea>
      <div class="multi-import-hint">💡 <strong>Formatos:</strong> <code>Nome, Matrícula, Número</code></div>
      <div class="multi-status info" id="multi-status" style="display: none"><span id="multi-status-text">Pronto para importar</span></div>
    </div>
    <div class="modal-footer no-print">
      <button type="button" class="btn btn-green btn-sm" onclick="closeM('m-aluno'); go('lista-turma');" style="margin-right: auto">📋 Ver Lista</button>
      <button type="button" class="btn btn-outline" onclick="closeM('m-aluno')">Cancelar</button>
      <button type="button" class="btn btn-green" onclick="salvarAluno()">💾 Salvar</button>
    </div>
  </div>
</div>

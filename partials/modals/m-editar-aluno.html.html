<div class="modal-overlay no-print" id="m-editar-aluno">
  <div class="modal">
    <div class="modal-header"><h3>✏ Editar Aluno</h3><button type="button" class="modal-close" onclick="closeM('m-editar-aluno')">×</button></div>
    <input id="editar-aluno-id" type="hidden" />
    <div class="form-row" style="grid-template-columns: 130px 1fr">
      <div class="form-group"><label class="form-label">Número</label><input class="form-control" id="editar-aluno-numero" type="number" /></div>
      <div class="form-group"><label class="form-label">Nome <span class="req">*</span></label><input class="form-control" id="editar-aluno-nome" /></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Escola <span class="req">*</span></label><select class="form-control" id="editar-aluno-escola" onchange="carregarTurmasPorEscolaParaAluno(this.value, 'editar-aluno-turma')"></select></div>
      <div class="form-group"><label class="form-label">Turma <span class="req">*</span></label><select class="form-control" id="editar-aluno-turma"></select></div>
    </div>
    <div class="modal-footer no-print">
      <button type="button" class="btn btn-outline" onclick="closeM('m-editar-aluno')">Cancelar</button>
      <button type="button" class="btn btn-primary" onclick="salvarEdicaoAluno()">💾 Salvar</button>
    </div>
  </div>
</div>

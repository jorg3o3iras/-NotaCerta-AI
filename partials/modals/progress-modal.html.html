<div class="modal-overlay no-print" id="progress-modal" style="display: none; z-index: 10000">
  <div class="modal" style="max-width: 500px; text-align: center">
    <div class="modal-header"><h3 id="progress-titulo">⏳ Processando...</h3><button type="button" class="modal-close" id="progress-fechar" onclick="progressManager.fechar()" style="display: none">×</button></div>
    <div style="padding: 10px 0">
      <div id="progress-icone" style="font-size: 48px; margin-bottom: 10px">🤖</div>
      <p id="progress-status" style="font-size: 14px; color: var(--text2); margin-bottom: 15px">Iniciando processamento...</p>
      <div class="progress" style="height: 12px; background: var(--bg2); border-radius: 10px; overflow: hidden; margin: 10px 0;"><div class="progress-fill pf-purple" id="progress-barra" style="width: 0%; transition: width 0.3s ease"></div></div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text3); margin-top: 4px;"><span id="progress-porcentagem">0%</span><span id="progress-tempo">⏱ estimado: --</span></div>
      <div style="margin-top: 15px; padding: 10px; background: var(--bg2); border-radius: 8px; text-align: left; font-size: 12px; color: var(--text2);"><div id="progress-etapas" style="display: flex; flex-direction: column; gap: 4px"></div></div>
    </div>
    <div class="modal-footer" style="justify-content: center; border-top: none; padding-top: 5px"><button type="button" class="btn btn-outline btn-sm" id="progress-cancelar" onclick="progressManager.fechar()" style="display: none">Cancelar</button></div>
  </div>
</div>

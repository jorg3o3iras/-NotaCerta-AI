<div class="page" id="page-turmas">
  <div class="page-header">
    <div><div class="page-title">👥 Turmas</div><p class="page-sub">1º Ano ao 9º Ano do Ensino Fundamental</p></div>
    <div class="page-actions no-print">
      <div class="search-wrap"><span class="search-ico">🔍</span><input oninput="filtrarTabela(this, 'tb-turmas')" placeholder="Buscar turma..." type="text" /></div>
      <select class="form-control" id="filtro-escola-turmas" onchange="aplicarFiltrosTurmas()"><option value="">Todas as escolas</option></select>
      <select class="form-control" id="filtro-serie-turmas" onchange="aplicarFiltrosTurmas()"><option value="">Todas as séries</option><option>1º Ano</option><option>2º Ano</option><option>3º Ano</option><option>4º Ano</option><option>5º Ano</option><option>6º Ano</option><option>7º Ano</option><option>8º Ano</option><option>9º Ano</option></select>
      <button type="button" class="btn btn-primary" onclick="aplicarFiltrosTurmas()">🔍 Filtrar</button>
      <button type="button" class="btn btn-outline" onclick="limparFiltrosTurmas()">✕ Limpar</button>
      <button type="button" class="btn btn-primary" onclick="openM('m-turma')">+ Nova Turma</button>
    </div>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Turma</th><th>Série</th><th>Turno</th><th>Escola</th><th>Professor(a)</th><th>Alunos</th><th>Ações</th></tr></thead>
        <tbody id="tb-turmas"><tr><td colspan="8" style="text-align: center; padding: 30px; color: var(--text3);">Carregando...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="page" id="page-alunos">
  <div class="page-header">
    <div><div class="page-title">🎒 Alunos</div><p class="page-sub">1º ao 9º Ano — Filtrar por escola, turma e série</p></div>
    <div class="page-actions no-print">
      <select class="form-control" id="filtro-escola-alunos" onchange="filtrarAlunosPorEscola(this.value)"><option value="">Todas as escolas</option></select>
      <select class="form-control" id="filtro-turma-alunos" onchange="carregarAlunos(document.getElementById('filtro-escola-alunos').value)"><option value="">Todas as turmas</option></select>
      <div class="search-wrap"><span class="search-ico">🔍</span><input oninput="filtrarTabela(this, 'tb-alunos')" placeholder="Buscar aluno..." type="text" /></div>
      <select class="form-control" id="filtro-serie-alunos" onchange="filtrarAlunosPorSerie(this.value)"><option value="">Todas séries</option><option>1º Ano</option><option>2º Ano</option><option>3º Ano</option><option>4º Ano</option><option>5º Ano</option><option>6º Ano</option><option>7º Ano</option><option>8º Ano</option><option>9º Ano</option></select>
      <button type="button" class="btn btn-green" onclick="go('lista-turma')">📋 Lista</button>
      <button type="button" class="btn btn-outline no-print" onclick="imprimirAlunos()">🖨 Imprimir</button>
      <button type="button" class="btn btn-primary" onclick="openM('m-aluno')">+ Novo Aluno</button>
    </div>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nº</th><th>Matrícula</th><th>Nome Completo</th><th>Série</th><th>Turma</th><th>Escola</th><th>Ações</th></tr></thead>
        <tbody id="tb-alunos"><tr><td colspan="7" style="text-align: center; padding: 30px; color: var(--text3);">Carregando...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

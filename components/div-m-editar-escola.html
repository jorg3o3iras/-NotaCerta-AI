<div class="modal-overlay no-print" id="m-editar-escola">
      <div class="modal">
        <div class="modal-header"><h3>✏ Editar Escola</h3><button type="button" class="modal-close" onclick="closeM('m-editar-escola')">×</button></div>
        <input id="editar-escola-id" type="hidden">
        <div class="form-row c1"><div class="form-group"><label class="form-label">Nome <span class="req">*</span></label><input class="form-control" id="editar-escola-nome"></div></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">INEP</label><input class="form-control" id="editar-escola-inep"></div>
          <div class="form-group"><label class="form-label">Município</label><input class="form-control" id="editar-escola-municipio"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">UF</label><input class="form-control" id="editar-escola-estado" maxlength="2"></div>
          <div class="form-group"><label class="form-label">Telefone</label><input class="form-control" id="editar-escola-telefone"></div>
        </div>
        <div class="form-row c1"><div class="form-group"><label class="form-label">Diretor(a)</label><input class="form-control" id="editar-escola-diretor"></div></div>
        <div class="modal-footer no-print">
          <button type="button" class="btn btn-outline" onclick="closeM('m-editar-escola')">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="salvarEdicaoEscola()">💾 Salvar Alterações</button>
        </div>
      </div>
    </div>

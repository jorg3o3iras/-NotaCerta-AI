<div class="modal-overlay no-print" id="m-prova">
      <div class="modal">
        <div class="modal-header"><h3>📝 Cadastrar Prova</h3><button type="button" class="modal-close" onclick="closeM('m-prova')">×</button></div>
        <div class="form-row c1"><div class="form-group"><label class="form-label">Título <span class="req">*</span></label><input class="form-control" id="modal-prova-titulo"></div></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Disciplina</label><select class="form-control" id="modal-prova-disciplina"><option>Matemática</option><option>Português</option><option>Ciências</option><option>História</option><option>Geografia</option><option>Inglês</option></select></div>
          <div class="form-group">
            <label class="form-label">Semestre</label>
            <select class="form-control" id="modal-prova-bimestre">
              <option>1º SEMESTRE</option>
              <option>2º SEMESTRE</option>
              <option>3º SEMESTRE</option>
              <option>4º SEMESTRE</option>
              <option>RECUPERAÇÃO</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Turma <span class="req">*</span></label><select class="form-control" id="modal-prova-turma"></select></div>
          <div class="form-group"><label class="form-label">Data <span class="req">*</span></label><input class="form-control" id="modal-prova-data" type="date"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Valor Nota</label><input class="form-control" id="modal-prova-valor" type="number" value="10"></div>
          <div class="form-group"><label class="form-label">Tipo</label><select class="form-control" id="modal-prova-tipo"><option value="4">4 Opções (A,B,C,D)</option><option value="3">3 Opções (A,B,C)</option></select></div>
        </div>
        <div class="form-row c1"><div class="form-group"><label class="form-label">Gabarito</label><div id="modal-gabarito-grid" style="display: flex; flex-wrap: wrap; gap: 6px"></div></div></div>
        <div class="modal-footer no-print">
          <button type="button" class="btn btn-outline" onclick="closeM('m-prova')">Cancelar</button>
          <button type="button" class="btn btn-green" onclick="salvarProvaModal()">💾 Salvar</button>
        </div>
      </div>
    </div>

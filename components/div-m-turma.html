<div class="modal-overlay no-print" id="m-turma">
      <div class="modal">
        <div class="modal-header"><h3>👥 Cadastrar Turma</h3><button type="button" class="modal-close" onclick="closeM('m-turma')">×</button></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Escola <span class="req">*</span></label><select class="form-control" id="turma-escola"></select></div>
          <div class="form-group"><label class="form-label">Ano Letivo</label><input class="form-control" id="turma-ano" type="number" value="2025"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Nome <span class="req">*</span></label><input class="form-control" id="turma-nome"></div>
          <div class="form-group"><label class="form-label">Série <span class="req">*</span></label><select class="form-control" id="turma-serie"><option>1º Ano</option><option>2º Ano</option><option>3º Ano</option><option>4º Ano</option><option>5º Ano</option><option>6º Ano</option><option>7º Ano</option><option>8º Ano</option><option>9º Ano</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Turno</label><select class="form-control" id="turma-turno"><option>Manhã</option><option>Tarde</option><option>Noite</option></select></div>
          <div class="form-group"><label class="form-label">Capacidade</label><input class="form-control" id="turma-capacidade" type="number"></div>
        </div>
        <div class="form-row c1"><div class="form-group"><label class="form-label">Professor(a)</label><input class="form-control" id="turma-professor"></div></div>
        <div class="modal-footer no-print">
          <button type="button" class="btn btn-outline" onclick="closeM('m-turma')">Cancelar</button>
          <button type="button" class="btn btn-green" onclick="salvarTurma()">💾 Salvar</button>
        </div>
      </div>
    </div>

<div class="modal-overlay no-print" id="m-usuario">
  <div class="modal">
    <div class="modal-header"><h3>👤 Cadastrar Usuário</h3><button type="button" class="modal-close" onclick="closeM('m-usuario')">×</button></div>
    <input id="editar-usuario-id" type="hidden" value="" />
    <div class="form-row c1"><div class="form-group"><label class="form-label">Nome <span class="req">*</span></label><input class="form-control" id="usuario-nome" /></div></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Login <span class="req">*</span></label><input class="form-control" id="usuario-username" /></div>
      <div class="form-group"><label class="form-label">Senha <span class="req">*</span></label><input class="form-control" id="usuario-senha" type="password" /></div>
    </div>
    <div class="form-row c1">
      <div class="form-group"><label class="form-label">Escola <span class="req" id="usuario-escola-req">*</span></label><select class="form-control" id="usuario-escola"></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">E-mail</label><input class="form-control" id="usuario-email" type="email" /></div>
      <div class="form-group"><label class="form-label">Perfil <span class="req">*</span></label><select class="form-control" id="usuario-perfil" onchange="atualizarObrigatorioEscolaUsuario()"><option value="usuario">Usuário</option><option value="admin">Administrador</option></select></div>
    </div>
    <div class="form-row c1">
      <div class="form-group"><label class="form-label" style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input checked id="usuario-ativo" style="width:16px;height:16px" type="checkbox" /> Usuário ativo</label></div>
    </div>
    <div class="modal-footer no-print">
      <button type="button" class="btn btn-outline" onclick="closeM('m-usuario')">Cancelar</button>
      <button type="button" class="btn btn-green" onclick="salvarUsuario()">💾 Salvar Usuário</button>
    </div>
  </div>
</div>
